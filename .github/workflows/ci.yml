#pipeline de integracion continua
#ejecuta linting con ruff y la suite completa de pruebas en cada push y pr sobre main
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: obtener codigo fuente
        uses: actions/checkout@v4

      - name: configurar python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: instalar dependencias fijadas
        run: pip install -r requirements.txt

      - name: verificar formato y linting con ruff
        run: python -m ruff check src/ tests/

      - name: ejecutar suite completa de pruebas
        run: >
          python -m pytest tests/
          --tb=short
          --cov=src
          --cov-report=term-missing
          --cov-fail-under=0

      - name: publicar reporte de cobertura
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=src --cov-report=xml --quiet
