#configuracion declarativa del proyecto, dependencias y herramientas de calidad
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indie-census"
dynamic = ["version"]
description = "Open data observatory and commercial viability engine for the independent game ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3",
    "pydantic>=2.8.2",
    "pyarrow>=17.0.0",
    "pandas>=2.2.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
]

[tool.setuptools.dynamic]
version = { attr = "src.version.PIPELINE_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
